name: Validate TraceBound
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install .
      - run: python scripts/validate.py --report output/validation.json
      - run: python -m tracebound demo --output output/ci-lab
      - run: python -m tracebound verify output/ci-lab
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tracebound-${{ matrix.os }}-${{ matrix.python }}
          path: output/
          retention-days: 14
